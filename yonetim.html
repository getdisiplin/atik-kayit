<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>ATİK Yönetim</title>
<link rel="stylesheet" href="ortak.css?v=3">
<style>
.sayfa{max-width:1000px}
.satir{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.satir>*{width:auto;flex:0 0 auto}.satir input,.satir select{flex:1 1 180px}
.btn{width:auto;min-height:42px;padding:0 16px;font-size:14px}
.tablo{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel);font-size:12px;position:sticky;top:0}
.link{background:var(--g50);border-radius:12px;padding:10px 14px;word-break:break-all;margin-bottom:12px;font-size:13px}
details{margin-bottom:14px}summary{cursor:pointer;font-weight:700}
.sil{color:var(--hata);cursor:pointer;background:none;border:0;font:inherit}
</style></head><body>
<div class="sayfa">
 <div class="ust"><img src="logo.png" alt=""><b>ATİK Yönetim</b></div>
 <div id="giris" class="kart"><div id="ghata"></div>
  <div class="alan"><label class="bas">E-posta</label><input id="em" type="email" autocomplete="username"></div>
  <div class="alan"><label class="bas">Parola</label><div style="position:relative"><input id="pw" type="password" autocomplete="current-password" style="padding-right:84px"><button type="button" id="goz" class="btn" style="position:absolute;right:4px;top:4px;min-height:38px;padding:0 12px">Göster</button></div></div>
  <div class="kvkk" id="say2">Parola: 0 karakter yazıldı</div>
  <button class="btn ana" id="gb" style="margin-top:12px">Giriş</button></div>
 <div id="panel" hidden>
  <div class="satir"><select id="sec"></select><button class="btn" id="kapat"></button><button class="btn" id="csv">CSV indir</button><button class="btn" id="yenile">Yenile</button><button class="btn" id="cik">Çıkış</button></div>
  <div class="link" id="lnk"></div>
  <div id="durum" class="kvkk" style="margin:0 0 10px"></div>
  <details><summary>Yeni etkinlik oluştur</summary><div class="kart" style="margin-top:10px">
   <div class="alan"><label class="bas">Başlık</label><input id="nb" placeholder="Fon Yemeği 2026"></div>
   <div class="alan"><label class="bas">Açıklama (isteğe bağlı)</label><input id="na"></div>
   <div class="alan"><label class="bas">Alanlar (her satıra bir alan)</label>
    <textarea id="nal" style="min-height:140px">Öğrenci Ad Soyad | metin | *
T.C. Kimlik No | tc | *
Veli Telefonu | tel | *
Katılacak kişi sayısı | sayi | *</textarea>
    <div class="kvkk">Biçim: <b>Etiket | tür | *</b> (* zorunlu). Türler: metin, tc, tel, sayi, tarih, uzun, onay, secim (seçim için sona <b>| Seçenek1, Seçenek2</b>). T.C. alanı varsa aynı TC ikinci kez kaydolamaz.</div></div>
   <button class="btn ana" id="olustur">Oluştur</button></div></details>
  <div class="satir"><input id="ara" placeholder="Ara…"><b id="say"></b></div>
  <div class="tablo"><table id="tb"></table></div>
 </div>
</div>
<script src="config.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok = sessionStorage.getItem('tok'), etks = [], kayitlar = [];
const H = () => ({apikey: CFG.ANON, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json'});
const api = (yol, o = {}) => fetch(CFG.URL + '/rest/v1/' + yol, {...o, headers: {...H(), ...(o.headers || {})}}).then(async r => {
  if (r.status === 401) { cikis(); throw new Error('oturum'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status);
  return r.status === 204 ? null : r.json().catch(() => null);
});

$('goz').onclick = () => { const g = $('pw').type === 'password'; $('pw').type = g ? 'text' : 'password'; $('goz').textContent = g ? 'Gizle' : 'Göster'; };
$('gb').onclick = async () => {
  const hata = m => $('ghata').innerHTML = '<div class="kutu-hata">' + m + '</div>';
  $('ghata').innerHTML = '';
  if (!$('em').value.trim() || !$('pw').value) return hata('E-posta ve parolayı yazın.');
  $('gb').disabled = true; $('gb').textContent = 'Giriş yapılıyor…';
  try {
    const r = await fetch(CFG.URL + '/auth/v1/token?grant_type=password', {method: 'POST', headers: {apikey: CFG.ANON, 'Content-Type': 'application/json'}, body: JSON.stringify({email: $('em').value.trim().toLowerCase(), password: $('pw').value})});
    const j = await r.json();
    if (!j.access_token) hata(j.error_code === 'invalid_credentials' ? 'E-posta ya da parola hatalı. "Göster" ile parolayı kontrol edin.' : 'Giriş yapılamadı: ' + (j.msg || r.status));
    else { tok = j.access_token; sessionStorage.setItem('tok', tok); await ac(); }
  } catch (e) { hata('Bağlantı ya da yükleme hatası: ' + e.message); $('giris').hidden = false; $('panel').hidden = true; }
  $('gb').disabled = false; $('gb').textContent = 'Giriş';
};
$('pw').oninput = () => $('say2').textContent = 'Parola: ' + $('pw').value.length + ' karakter yazıldı';
$('pw').onkeydown = e => { if (e.key === 'Enter') $('gb').click(); };
function cikis() { sessionStorage.removeItem('tok'); tok = null; $('panel').hidden = true; $('giris').hidden = false; }
$('cik').onclick = cikis;

async function ac() {
  $('giris').hidden = true; $('panel').hidden = false;
  etks = await api('etkinlik?select=*&order=olusma.desc');
  const eski = $('sec').value;
  $('sec').innerHTML = etks.map(e => `<option value="${e.id}">${esc(e.baslik)}${e.acik ? '' : ' (kapalı)'}</option>`).join('');
  if (eski) $('sec').value = eski;
  sec();
}
const sc = () => etks.find(e => e.id === $('sec').value);
async function tumKayit(id) {
  let hepsi = [];
  for (let n = 0; ; n += 1000) {
    const s = await api(`kayit?etkinlik_id=eq.${id}&select=id,veri,olusma&order=olusma.desc`, {cache: 'no-store', headers: {Range: `${n}-${n + 999}`, 'Range-Unit': 'items'}});
    hepsi = hepsi.concat(s || []);
    if (!s || s.length < 1000) return hepsi;
  }
}
async function sec() {
  const e = sc(); if (!e) return;
  $('kapat').textContent = e.acik ? 'Kaydı kapat' : 'Kaydı aç';
  const dizin = location.href.replace(/yonetim\.html.*$/, '');
  $('lnk').innerHTML = 'Veli linki: <b>' + esc(dizin + 'form.html?e=' + e.slug) + '</b>';
  kayitlar = await tumKayit(e.id);
  ciz();
  durum('Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR'));
}
function ciz() {
  const e = sc(), q = $('ara').value.toLowerCase();
  const f = kayitlar.filter(k => !q || JSON.stringify(k.veri).toLowerCase().includes(q));
  $('say').textContent = f.length + ' kayıt';
  $('tb').innerHTML = `<tr><th>#</th>${e.alanlar.map(a => `<th>${esc(a.etiket)}</th>`).join('')}<th>Zaman</th><th></th></tr>` +
    f.map((k, i) => `<tr><td>${f.length - i}</td>${e.alanlar.map(a => `<td>${esc(k.veri[a.ad])}</td>`).join('')}<td>${new Date(k.olusma).toLocaleString('tr-TR')}</td><td><button class="sil" data-sil="${k.id}">Sil</button></td></tr>`).join('');
}
const durum = (m, hata) => { $('durum').textContent = m; $('durum').style.color = hata ? 'var(--hata)' : 'var(--g700)'; };
$('tb').onclick = async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.sil) { b.parentNode.innerHTML = `<button class="sil" data-evet="${b.dataset.sil}">Evet, sil</button> <button class="sil" style="color:var(--ink3)" data-vaz="1">Vazgeç</button>`; return; }
  if (b.dataset.vaz) return ciz();
  if (!b.dataset.evet) return;
  try {
    const r = await api('kayit?id=eq.' + b.dataset.evet, {method: 'DELETE', headers: {Prefer: 'return=representation'}});
    if (!r || !r.length) durum('Silinemedi: kayıt bulunamadı ya da yetki yok.', true); else durum('Kayıt silindi.');
  } catch (e) { durum('Silinemedi: ' + e.message, true); }
  sec();
};
$('sec').onchange = sec; $('ara').oninput = ciz; $('yenile').onclick = sec;
$('kapat').onclick = async () => { const e = sc(); await api('etkinlik?id=eq.' + e.id, {method: 'PATCH', body: JSON.stringify({acik: !e.acik})}); ac(); };
$('csv').onclick = async () => {
  try { kayitlar = await tumKayit(sc().id); ciz(); } catch (x) { return durum('CSV için kayıtlar alınamadı: ' + x.message, true); }
  const e = sc(), q = c => '"' + String(c ?? '').replace(/"/g, '""') + '"';
  const hucre = (a, v) => { v = v ?? ''; if (/^[=+\-@]/.test(v)) v = "'" + v; return (a.tur === 'tc' || a.tur === 'tel') && v ? '="' + v + '"' : q(v); };
  const satir = ['sep=;', e.alanlar.map(a => q(a.etiket)).concat(q('Zaman')).join(';')]
    .concat(kayitlar.map(k => e.alanlar.map(a => hucre(a, k.veri[a.ad])).concat(q(new Date(k.olusma).toLocaleString('tr-TR'))).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + satir.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
  const z = new Date(), p = n => String(n).padStart(2, '0');
  a.download = e.slug + '-' + z.getFullYear() + p(z.getMonth() + 1) + p(z.getDate()) + '-' + p(z.getHours()) + p(z.getMinutes()) + p(z.getSeconds()) + '.csv'; a.click();
  durum(kayitlar.length + " kayıt indirildi. Dosya adında saat var; indirilenler klasöründe en yeni dosyayı açın.");
};
const slugla = s => s.toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
$('olustur').onclick = async () => {
  const baslik = $('nb').value.trim(); if (!baslik) return alert('Başlık gerekli.');
  const alanlar = $('nal').value.split('\n').map(s => s.trim()).filter(Boolean).map((s, i) => {
    const p = s.split('|').map(x => x.trim());
    return {ad: 'a' + (i + 1), etiket: p[0], tur: p[1] || 'metin', zorunlu: p[2] === '*', ...(p[3] ? {secenekler: p[3].split(',').map(x => x.trim())} : {})};
  });
  const tc = alanlar.find(a => a.tur === 'tc');
  if (tc) tc.ad = 'tc';
  try {
    await api('etkinlik', {method: 'POST', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({slug: slugla(baslik), baslik, aciklama: $('na').value.trim() || null, alanlar, tekil_alan: tc ? 'tc' : null})});
  } catch (e) { return alert('Oluşturulamadı (aynı başlık var mı?): ' + e.message); }
  $('nb').value = ''; ac();
};
setInterval(() => { if (tok && !$('panel').hidden && !document.hidden && !document.querySelector('[data-evet]')) sec().catch(() => {}); }, 30000);
if (tok) ac().catch(() => {});
</script>
</body></html>
